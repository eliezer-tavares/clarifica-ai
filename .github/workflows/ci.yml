# Integração Contínua do Clarifica.ai
#
# Dois portões independentes:
#   1. testes-unitarios — suíte completa em Node (incluindo inferência de IA
#      REAL com os modelos quantizados oficiais, cacheados entre execuções);
#   2. testes-e2e — a extensão é carregada de verdade no Chromium (canal
#      chromium, headless moderno) pelo Playwright e seus fluxos são
#      exercitados em páginas HTTP reais: service worker, popup, injeção
#      via chrome.scripting, ARIA, filtros de daltonismo e restauração.
#
# Requisito de estrutura: o repositório mantém a pasta `clarifica-ai/` na
# raiz (a mesma pasta carregada via "Carregar sem compactação" no Chrome).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes-unitarios:
    name: Suíte unitária + inferência de IA real
    # Fixo em 24.04 (NÃO usar ubuntu-latest): desde 19/10/2026 o GitHub
    # migra ubuntu-latest para Ubuntu 26.04 (actions/runner-images#14748)
    # e o Playwright 1.57 travado no lockfile não reconhece 26.04 — o
    # "playwright install --with-deps" falha de imediato com
    # "Cannot install dependencies for ubuntu26.04-x64". Pinar a imagem
    # mantém a CI no mesmo ambiente validado ponta a ponta.
    runs-on: ubuntu-24.04
    # Travamento de segurança: um job nunca deveria levar mais que isto.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: clarifica-ai/tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Os pesos (~865 MB) são baixados uma única vez pelo job; a chave
      # embute os SHAs fixados em VERSOES_MODELOS.md — mudou o modelo,
      # invalida o cache automaticamente.
      - name: Cache dos modelos de IA (Hugging Face)
        uses: actions/cache@v4
        with:
          path: clarifica-ai/tests/.cache
          key: hf-modelos-distilbart-a6c58857--vitgpt2-215b4edc--whisper-5332fcc3--trocr-56c1626e--opusmt-9d2ba69a--squad-bdbb0a5e

      - name: Instalar dependências (até 3 tentativas)
        run: |
          for tentativa in 1 2 3; do
            echo "::group::Tentativa $tentativa de 3 — npm ci"
            if npm ci; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Falha transitória no npm ci (tentativa $tentativa). Aguardando 15 s antes de repetir..."
            sleep 15
          done
          echo "::error::Falha no npm ci após 3 tentativas."
          exit 1

      # Os pesos (~865 MB) são baixados UMA vez por job, em um passo
      # DEDICADO (fora do node --test) e com ATÉ 3 TENTATIVAS: falhas
      # transitórias de rede ao Hugging Face — comuns em runners — não
      # derrubam mais a suíte inteira com erro ambíguo dentro de um teste.
      - name: Pré-baixar modelos de IA do Hugging Face (até 3 tentativas)
        run: |
          for tentativa in 1 2 3; do
            echo "::group::Tentativa $tentativa de 3 — baixar pesos (~865 MB)"
            if npm run preparar:modelos; then
              echo "::endgroup::"
              echo "Modelos prontos em tests/.cache."
              exit 0
            fi
            echo "::endgroup::"
            echo "Falha transitória de rede (tentativa $tentativa). Aguardando 20 s antes de repetir..."
            sleep 20
          done
          echo "::error::Falha ao baixar os modelos do Hugging Face após 3 tentativas. Os SHAs fixados na chave de cache garantem que a próxima execução reaproveite o que estiver em cache; rode o job novamente."
          exit 1

      - name: Executar suíte completa (Node --test)
        run: npm test

  testes-e2e:
    name: E2E da extensão no Chromium real
    runs-on: ubuntu-24.04  # mesma justificativa do job acima (Playwright 1.57 + Ubuntu 26)
    needs: testes-unitarios
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clarifica-ai/tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache dos navegadores do Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('clarifica-ai/tests/package-lock.json') }}

      - name: Instalar dependências (até 3 tentativas)
        run: |
          for tentativa in 1 2 3; do
            echo "::group::Tentativa $tentativa de 3 — npm ci"
            if npm ci; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Falha transitória no npm ci (tentativa $tentativa). Aguardando 15 s antes de repetir..."
            sleep 15
          done
          echo "::error::Falha no npm ci após 3 tentativas."
          exit 1

      # A instalação do Chromium baixa o navegador e resolve dependências
      # de sistema via apt — as duas etapas são suscetíveis a falhas
      # transitórias de rede/espelho, então também repetimos até 3 vezes.
      - name: Instalar Chromium com dependências do sistema (até 3 tentativas)
        run: |
          for tentativa in 1 2 3; do
            echo "::group::Tentativa $tentativa de 3 — instalar Chromium (Playwright)"
            if npx playwright install --with-deps chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Falha transitória na instalação (tentativa $tentativa). Aguardando 20 s antes de repetir..."
            sleep 20
          done
          echo "::error::Falha ao instalar o Chromium após 3 tentativas."
          exit 1

      - name: Executar E2E da extensão
        run: npm run test:e2e

      - name: Publicar relatório E2E em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-e2e
          path: clarifica-ai/tests/e2e/playwright-report/
          retention-days: 14
          # O job pode morrer antes de qualquer teste rodar (ex.: falha na
          # instalação do Chromium) — nesse caso não há relatório, e o
          # aviso "No files were found" não deve sujar o log.
          if-no-files-found: ignore
