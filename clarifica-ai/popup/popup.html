<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Clarifica.ai</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div>
      <h1>🧠 Clarifica.ai</h1>
      <p>__MSG_subtitulo__</p>
    </div>
    <button id="btn-tema" class="tema-btn" type="button">__MSG_btnTemaRotuloAuto__</button>
  </header>
  <main>
    <div id="status" class="status-bar" role="status" aria-live="polite">__MSG_statusPronto__</div>

    <h2 class="secao-titulo">__MSG_secaoCognitiva__</h2>
    <div class="grid-buttons">
      <button class="mode-btn" data-mode="leitura">__MSG_btnLeitura__</button>
      <button class="mode-btn primary" data-mode="resumo">__MSG_btnResumo__</button>
      <button class="mode-btn" data-mode="imagens">__MSG_btnImagens__</button>
      <!-- Assistente de perguntas e respostas (v2.0.0): modelo QA extrativo
           (distilbert-squad, ~70 MB) responde a partir do PRÓPRIO texto da
           página — sem geração livre. A pergunta é digitada no campo abaixo
           e enviada ao worker de IA pela função injetada. -->
      <button class="mode-btn" data-mode="perguntar">__MSG_btnPerguntar__</button>
    </div>
    <div class="pergunta-row">
      <label for="pergunta">__MSG_labelPergunta__</label>
      <input type="text" id="pergunta" placeholder="__MSG_placeholderPergunta__" autocomplete="off">
    </div>
    <!-- Saída em português (v2.0.0): resumo e descrição de imagens gerados
         em inglês pelos modelos e traduzidos pela cadeia modelo→modelo
         (opus-mt-en-ROMANCE, já fixado no registry) — zero modelos novos.
         Português Claro: geração com frases curtas e ordem direta, assistida
         por modelo (parâmetros de geração), não por regras de reescrita. -->
    <div class="selector-row">
      <label for="idioma-saida">__MSG_labelIdiomaSaida__</label>
      <select id="idioma-saida">
        <option value="original">__MSG_idiomaSaidaOriginal__</option>
        <option value="pt">__MSG_idiomaSaidaPt__</option>
      </select>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="claro">
      <label for="claro">__MSG_labelPtClaro__</label>
    </div>

    <h2 class="secao-titulo">__MSG_secaoDaltonismo__</h2>
    <div class="grid-buttons">
      <button class="mode-btn dalton" data-mode="protanopia">__MSG_btnProtanopia__</button>
      <button class="mode-btn dalton" data-mode="deuteranopia">__MSG_btnDeuteranopia__</button>
      <button class="mode-btn dalton" data-mode="tritanopia">__MSG_btnTritanopia__</button>
    </div>

    <div class="slider-row">
      <label for="intensidade">__MSG_labelIntensidade__</label>
      <input type="range" id="intensidade" min="0" max="100" step="5" value="100">
      <span id="intensidade-valor" class="slider-valor" aria-hidden="true">100%</span>
    </div>

    <h2 class="secao-titulo">__MSG_secaoPerfis__</h2>
    <div class="grid-buttons">
      <button class="mode-btn perfil" data-mode="tea" aria-pressed="false">__MSG_btnPerfilTea__</button>
      <button class="mode-btn perfil" data-mode="tdah" aria-pressed="false">__MSG_btnPerfilTdah__</button>
      <button class="mode-btn perfil" data-mode="dislexia" aria-pressed="false">__MSG_btnPerfilDislexia__</button>
    </div>
    <!-- Sincronização de perfis (v2.0.0): com a caixa marcada, o filtro e o
         perfil ativos são REAPLICADOS automaticamente em cada navegação e
         propagados para as abas http(s) já abertas (injeção via service
         worker). Persistido no chrome.storage — o padrão é ligado. -->
    <div class="checkbox-row">
      <input type="checkbox" id="sincronizar" checked>
      <label for="sincronizar">__MSG_labelSincronizar__</label>
    </div>

    <h2 class="secao-titulo">__MSG_secaoAudio__</h2>
    <div class="grid-buttons">
      <button class="mode-btn midia" data-mode="transcrever" aria-pressed="false">__MSG_btnTranscreverAudio__</button>
      <button class="mode-btn midia" data-mode="ocr" aria-pressed="false">__MSG_btnOcr__</button>
      <button class="mode-btn midia" data-mode="traduzir" aria-pressed="false">__MSG_btnTraduzir__</button>
      <button class="mode-btn midia" data-mode="voz" aria-pressed="false">__MSG_btnLerVozAlta__</button>
      <!-- Legendas ao vivo (v1.4.0): toggle com aria-pressed (captura da aba,
           Whisper local, WebVTT sobre o vídeo). O seletor abaixo alterna a
           tarefa do Whisper: original (transcrição) ou inglês (tradução). -->
      <button class="mode-btn midia" data-mode="legendas" aria-pressed="false">__MSG_btnLegendasAoVivo__</button>
      <button class="mode-btn midia" data-mode="verificar-legendas">__MSG_btnVerificarLegendas__</button>
    </div>
    <div class="selector-row">
      <label for="idioma-legendas">__MSG_labelIdiomaLegendas__</label>
      <select id="idioma-legendas">
        <option value="original">__MSG_idiomaLegendaOriginal__</option>
        <option value="ingles">__MSG_idiomaLegendaIngles__</option>
      </select>
    </div>
    <p class="nota-legendas">__MSG_notaLegendasAtraso__</p>

    <h2 class="secao-titulo">__MSG_secaoAuditoria__</h2>
    <div class="grid-buttons">
      <!-- Painel de auditoria WCAG em tempo real (v2.0.0): leitura pura de
           estado (sem IA e sem rede) reexecutada a cada mutação relevante
           da página, com painel acessível (dialog não modal, Esc fecha). -->
      <button class="mode-btn auditoria" data-mode="auditoria" aria-pressed="false">__MSG_btnPainelAuditoria__</button>
    </div>

    <div id="result-area" class="hidden">
      <h3>__MSG_tituloResultado__</h3>
      <div id="ai-output" class="output-box" role="region" aria-label="__MSG_ariaResultado__"></div>
      <button id="close-result" class="text-btn">__MSG_btnFechar__</button>
    </div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
